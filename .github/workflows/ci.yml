name: CRM checks
on:
  push:
    branches: [main, 'skills/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-reporting.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/demo.py
  excel-refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install current headless Calc and UNO bridge
        run: |
          sudo add-apt-repository -y ppa:libreoffice/ppa
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-calc python3-uno python3-openpyxl
          libreoffice --version
      - name: Reopen, refresh, recalculate and reconcile Excel reports
        env:
          RUN_LIBREOFFICE: '1'
        run: /usr/bin/python3 -m unittest discover -s tests -p test_weekly_report.py -v
      - name: Produce downloadable fictional weekly report
        run: |
          /usr/bin/python3 scripts/target_demo.py --output /tmp/target-demo
          /usr/bin/python3 scripts/recalculate_report.py /tmp/target-demo/weekly.xlsx /tmp/target-demo/weekly-recalculated.xlsx
      - uses: actions/upload-artifact@v4
        with:
          name: fictional-weekly-report
          path: /tmp/target-demo/weekly-recalculated.xlsx
  workflow-import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build n8n image and import workflow
        run: |
          docker build -f automation/Dockerfile -t outreach-n8n .
          python3 -c 'import json; json.dump([json.load(open("automation/weekly-metrics.json"))], open("/tmp/workflow.json", "w"))'
          docker run --rm -v "/tmp/workflow.json:/tmp/workflow.json:ro" outreach-n8n import:workflow --input=/tmp/workflow.json
